name: Build & Test APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # 2. Setup JDK 17
      # ============================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================
      # 3. Setup Gradle
      # ============================================
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      # ============================================
      # 4. Grant execute permission
      # ============================================
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ============================================
      # 5. Cache Gradle
      # ============================================
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ============================================
      # 6. Run Unit Tests
      # ============================================
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ============================================
      # 7. Build Debug APK
      # ============================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ============================================
      # 8. ساخت Keystore موقت برای امضای Release
      # ============================================
      - name: Generate Temporary Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/temp-release.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temp1234 \
            -keypass temp1234 \
            -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=IR"

      # ============================================
      # 9. Build Release APK (امضا شده با keystore موقت)
      # ============================================
      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/temp-release.jks \
            -Pandroid.injected.signing.store.password=temp1234 \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password=temp1234

      # ============================================
      # 10. Upload Debug APK
      # ============================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # ============================================
      # 11. Upload Signed Release APK
      # ============================================
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk

      # ============================================
      # 12. Build Summary
      # ============================================
      - name: Build Summary
        if: always()
        run: |
          echo "===================================="
          echo "Build Completed"
          echo "===================================="
          echo "Debug APK:  app-debug.zip"
          echo "Release APK (Signed): app-release-signed.zip"
          echo "===================================="
